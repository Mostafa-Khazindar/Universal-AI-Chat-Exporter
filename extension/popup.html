<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal AI Exporter</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .logo {
      font-size: 20px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
    .btn {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #6366f1;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .info {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">AI Exporter & Compressor</div>
      <div class="subtitle">Claude • ChatGPT • Gemini • DeepSeek</div>
    </div>
  </div>

  <div class="status-card" id="status-card">
    <span><span class="status-dot"></span> Ready on active tab</span>
  </div>

  <button class="btn btn-primary" id="btn-quick-copy">
    <span>📋 Copy Compressed for Next AI</span>
  </button>
  <button class="btn btn-secondary" id="btn-quick-md">
    <span>💾 Download Markdown (.md)</span>
  </button>
  <button class="btn btn-secondary" id="btn-quick-json">
    <span>💾 Download JSON (.json)</span>
  </button>

  <div class="info">
    Or use the in-page floating <b>⚡ Export & Compress</b> button on any AI chat page!
  </div>

  <script src="popup.js"></script>
</body>
</html>
